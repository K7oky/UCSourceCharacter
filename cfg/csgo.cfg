// =============================================================================
// csgo.cfg -- CS:GO matchmaking defaults
//
//   exec csgo
//
// Restores every movement variable that surf.cfg (or a live console session)
// may have changed. Values are the Source defaults recorded in
// SourceMovementCVars.cpp with their source line references.
// =============================================================================

sv_cheats "1"

sv_gravity "800"
sv_friction "5.2"
sv_stopspeed "80"
sv_accelerate "5.5"
sv_airaccelerate "12"
sv_maxspeed "320"
sv_maxvelocity "3500"
sv_stepsize "18"
sv_bounce "0"

sv_jump_impulse "301.993377"
sv_staminajumpcost "0.08"
sv_staminalandcost "0.05"
sv_staminarecoveryrate "60"
sv_staminamax "80"

// The matchmaking speed lock, on. PreventBunnyJumping clamps you to
// sv_enablebunnyhopping_maxspeedfactor * 260 = 286 u/s at the moment you jump.
sv_enablebunnyhopping "0"
sv_autobunnyhopping "0"
sv_enablebunnyhopping_maxspeedfactor "1.1"

sv_timebetweenducks "0.4"
sv_crouch_spam_penalty "2"
sv_accelerate_use_weapon_speed "1"
sv_optimizedmovement "1"

sv_footsteps "1"
sv_footstep_sound_frequency "0.97"
sv_footstep_volume_walk "0.2"
sv_footstep_volume_run "0.5"

// Last, so it reverts anything above that is still off its default and then
// locks further changes. Drop this line if you want to keep tweaking.
sv_cheats "0"

echo "csgo.cfg applied -- matchmaking defaults restored, sv_cheats back to 0."
