// =============================================================================
// bhop.cfg -- bunnyhop preset
//
//   exec bhop        apply
//   exec csgo        back to CS:GO matchmaking defaults
//
// Three changes, and all three are needed -- leaving any one out gives you a
// player who visibly bunnyhops but never actually accelerates:
//
//   1. AUTOHOP. sv_autobunnyhopping 1 re-jumps for you while SPACE is held, so
//      you do not have to hit the one tick where you touch the ground.
//
//   2. NO SPEED CAP. sv_enablebunnyhopping 1 removes PreventBunnyJumping. These
//      two are INDEPENDENT gates in the original (cs_gamemovement.cpp:702 and
//      :705) and are the reason "I set autobunnyhopping and still cap at 286"
//      is the most common bhop complaint.
//
//   3. STAMINA OFF. Otherwise every hop adds stamina, the next jump is scaled
//      down, and the chain dies after a handful of jumps.
// =============================================================================

sv_cheats "1"

// ---- the three that matter --------------------------------------------------
sv_autobunnyhopping "1"
sv_enablebunnyhopping "1"

sv_staminamax "0"
sv_staminajumpcost "0"
sv_staminalandcost "0"
sv_staminarecoveryrate "0"

// ---- air control ------------------------------------------------------------
// 1000 is the common "bhop server" value: strafe gain is generous and the map
// carries you. Drop to 100 for something closer to a skill-based KZ feel, or to
// 12 for matchmaking air control (at which point the preset is pointless).
//
// The 30 u/s budget cap inside AirAccelerate is what actually makes strafing
// work; sv_airaccelerate only sets how fast you reach it. Raising it past a few
// hundred changes less than people expect.
sv_airaccelerate "1000"

// ---- speed ceiling ----------------------------------------------------------
// Per-axis clamp, not a magnitude clamp (Q48), so diagonal speed can reach
// sqrt(2) x this. 3500 is the Source default and is far beyond reachable speed.
sv_maxvelocity "3500"

// ---- unchanged, restated so the file is self-contained ----------------------
sv_gravity "800"
sv_friction "5.2"
sv_accelerate "5.5"
sv_stopspeed "80"
sv_maxspeed "320"
sv_stepsize "18"
sv_jump_impulse "301.993377"

echo "bhop.cfg applied -- autohop on, speed cap off, stamina off, sv_airaccelerate 1000."
echo "Hold SPACE and alternate A/D with the mouse. Watch speed with cl_showpos 1."

// -----------------------------------------------------------------------------
// If you want to practise the manual hop instead of using autohop, set
// sv_autobunnyhopping 0 and keep everything else. That is the KZ ruleset, and
// cfg/kz.cfg is exactly that with a lower sv_airaccelerate.
// -----------------------------------------------------------------------------
