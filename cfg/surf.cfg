// =============================================================================
// surf.cfg -- surf server preset
//
//   exec surf        apply
//   exec csgo        back to CS:GO matchmaking defaults
//
// Nothing here is a code change. Surf launching is emergent from TryPlayerMove
// and ClipVelocity, which are already ported: ride a plane steeper than the
// walkable limit, gravity keeps pushing you into it, ClipVelocity redirects
// that into velocity ALONG the ramp, and you keep it when the ramp ends.
//
// What stops it working on matchmaking settings is sv_airaccelerate. At 12 you
// can barely steer in the air, so you never build the speed that makes the exit
// launch you. Real surf servers run 100-800. That is the whole trick.
// =============================================================================

// Every movement variable is cheat-protected, and sv_cheats 0 REVERTS them
// rather than just blocking changes -- so this has to come first.
sv_cheats "1"

// ---- the one that actually matters ------------------------------------------
// Air acceleration. CS:GO matchmaking is 12; surf servers run 100-800.
// Higher = more control and faster gain. 800 is the classic "easy surf" value.
sv_airaccelerate "800"

// ---- speed ceilings ---------------------------------------------------------
// Per-axis clamp, not a magnitude clamp (Q48), so diagonal speed can reach
// sqrt(3) * this. 3500 is already the Source default and is plenty.
sv_maxvelocity "3500"

// Removes PreventBunnyJumping, the 1.1 * 260 = 286 u/s clamp applied at the
// moment you jump. This is the matchmaking speed lock; surf needs it gone or
// every landing-and-rejump throws away the speed you just earned.
sv_enablebunnyhopping "1"

// Re-jump automatically while holding SPACE, so you do not have to time the
// frame you touch down on. Independent of the line above -- both are needed.
sv_autobunnyhopping "1"

// ---- feel -------------------------------------------------------------------
// Defaults, restated so this file is self-contained and you can see what a surf
// preset does NOT change. Gravity stays 800: lowering it makes ramps float.
sv_gravity "800"
sv_friction "5.2"
sv_accelerate "5.5"
sv_maxspeed "320"

// ---- audio ------------------------------------------------------------------
// Footsteps do not fire in the air anyway (UpdateStepSound requires ground
// contact), so this only affects the walk to the first ramp.
sv_footsteps "1"

echo "surf.cfg applied -- sv_airaccelerate 800, bunnyhopping unlocked."
echo "Ramps must be STEEPER than 45.573 degrees to surf. Shallower ones are walkable floor."
echo "Check with: cl_showpos 1   (it prints the ground normal and slope angle)"
