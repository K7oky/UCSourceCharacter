// =============================================================================
// kz.cfg -- KZ / climb preset, KZTimer-style
//
//   exec kz          apply
//   exec csgo        back to CS:GO matchmaking defaults
//
// KZ is not "CS:GO but harder". Two changes define it, and both are here:
//
//   1. STAMINA IS OFF. In matchmaking every jump adds stamina and the next jump
//      is scaled down by it, so consecutive jumps get shorter and shorter. KZ
//      removes that entirely -- jump number fifty is exactly as high as the
//      first. Without this, no climb map is completable.
//
//   2. NO SPEED CAP ON JUMP. sv_enablebunnyhopping 1 removes
//      PreventBunnyJumping, which otherwise clamps you to 1.1 x 260 = 286 u/s
//      at the moment you leave the ground and throws away everything you gained.
//
// Autohop stays OFF: timing the jump yourself is the skill KZ is built around.
// =============================================================================

// Movement variables are cheat-protected, and sv_cheats 0 REVERTS them rather
// than just blocking changes -- so this has to come first.
sv_cheats "1"

// ---- stamina off ------------------------------------------------------------
// sv_staminamax 0 alone is enough: the simulation clamps stamina to [0, max], so
// a max of 0 pins it at 0 and the `if (stamina > 0)` scaling never runs. The
// other three are set anyway so the intent survives someone changing one.
sv_staminamax "0"
sv_staminajumpcost "0"
sv_staminalandcost "0"
sv_staminarecoveryrate "0"

// ---- no jump speed cap ------------------------------------------------------
sv_enablebunnyhopping "1"

// Manual timing. Set to 1 if you want to practise routes without learning the
// hop first -- it is the single biggest difficulty change in this file.
sv_autobunnyhopping "0"

// ---- air control ------------------------------------------------------------
// KZTimer mode. Matchmaking is 12, which makes long jumps and strafe-gain
// essentially impossible; 100 is what the classic timer mode runs.
// For "vanilla" KZ -- pure CS:GO movement, only stamina removed -- set this
// back to 12 and leave everything else in this file as it is.
sv_airaccelerate "100"

// ---- unchanged, restated so the file is self-contained ----------------------
sv_gravity "800"
sv_friction "5.2"
sv_accelerate "5.5"
sv_stopspeed "80"
sv_maxspeed "320"
sv_maxvelocity "3500"
sv_stepsize "18"
sv_jump_impulse "301.993377"

// ---- crouch ----------------------------------------------------------------
// KZ leans heavily on crouch-jumps and repeated ducking. These two throttle how
// fast the duck key can be reused; the defaults are tuned for a deathmatch, not
// for a climb map. Loosen them if crouch chains feel sticky -- this is a
// judgement call for this project, not a transcribed server setting.
// sv_timebetweenducks "0"
// sv_crouch_spam_penalty "0"

echo "kz.cfg applied -- stamina off, no jump speed cap, sv_airaccelerate 100."
echo "Autohop is OFF (sv_autobunnyhopping 1 to enable). Jump height is now constant."

// -----------------------------------------------------------------------------
// NOT AVAILABLE IN THIS PROJECT
//
//   sv_air_max_wishspeed   The 30 u/s air budget is a literal inside
//                          AirAccelerate (Q5), not a variable. KZ servers leave
//                          it at 30, so nothing is lost -- but you cannot tune
//                          it from the console here.
//
//   sv_ladder_scale_speed  Ladders are not implemented. KZ maps that require a
//                          ladder climb will not be completable.
//
//   sv_accelerate_use_weapon_speed is present and left at 1; with no weapon
//   system the weapon-speed branch is skipped anyway (UNKNOWN-3).
// -----------------------------------------------------------------------------
